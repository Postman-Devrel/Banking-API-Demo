  responses:
    BadRequest:
      description: The request is malformed or violates a schema.
      headers: &a10
        X-Demo-Run-Id: *a1
        X-Request-Id: *a2
        X-RateLimit-Limit: *a3
        X-RateLimit-Remaining: *a4
        X-RateLimit-Reset: *a5
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A valid API key is required.
      headers: *a10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The principal lacks permission.
      headers: *a10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible.
      headers: *a10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A state transition, uniqueness rule, or idempotency reservation conflicted.
      headers: *a10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The run-and-credential rate limit was exceeded.
      headers:
        X-Demo-Run-Id: *a1
        X-Request-Id: *a2
        X-RateLimit-Limit: *a3
        X-RateLimit-Remaining: *a4
        X-RateLimit-Reset: *a5
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A bounded run or idempotency store reached capacity.
      headers: *a10
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
