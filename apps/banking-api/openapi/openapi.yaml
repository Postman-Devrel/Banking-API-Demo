openapi: 3.1.0
info:
  title: Intergalactic Banking API
  version: 2.0.0
  description: A deterministic, run-scoped Banking API for comparing direct agent integrations with Postman
    Fabric Gateway. Monetary values are non-negative safe integers in minor units; all fictional currencies
    currently use exponent 0.
  contact:
    name: Intergalactic Banking API team
    url: https://www.postman.com/
  license:
    name: ISC
servers:
  - url: http://localhost:3000
    description: Local demo server
tags:
  - name: System
    description: Health and contract discovery.
  - name: Admin
    description: Credential administration.
  - name: Accounts
    description: Caller-owned accounts.
  - name: Transactions
    description: Atomic immutable ledger entries.
  - name: Customers
    description: Customer profiles.
  - name: Beneficiaries
    description: Verified payment destinations.
  - name: Cards
    description: Cards and lifecycle controls.
  - name: Payments
    description: Scheduled payments, standing orders, and direct debits.
  - name: Statements
    description: Paginated transaction statements.
  - name: Foreign Exchange
    description: Rational deterministic FX rates and quotes.
  - name: Notifications
    description: Constrained notification preferences.
  - name: Disputes
    description: Customer evidence and administrator-controlled lifecycle.
  - name: Audit
    description: Append-only activity history.
  - name: Demo
    description: Canonical run reset.
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags:
        - System
      summary: Check service health
      description: Check service health in the selected run.
      operationId: checkHealth
      parameters:
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Check service health succeeded.
          headers:
            X-Demo-Run-Id: &a1
              $ref: "#/components/headers/X-Demo-Run-Id"
            X-Request-Id: &a2
              $ref: "#/components/headers/X-Request-Id"
            X-RateLimit-Limit: &a3
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining: &a4
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset: &a5
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
  /openapi.yaml:
    get:
      tags:
        - System
      summary: Download the OpenAPI contract
      description: Download the OpenAPI contract in the selected run.
      operationId: getOpenApiDocument
      parameters:
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Download the OpenAPI contract succeeded.
          headers:
            X-Demo-Run-Id: *a1
            X-Request-Id: *a2
            X-RateLimit-Limit: *a3
            X-RateLimit-Remaining: *a4
            X-RateLimit-Reset: *a5
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
  /api/v1/auth:
    get:
      tags:
        - Admin
      summary: Create a deprecated development credential
      description: Create a deprecated development credential in the selected run.
      operationId: generateLegacyApiKey
      parameters:
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Create a deprecated development credential succeeded.
          headers:
            X-Demo-Run-Id: *a1
            X-Request-Id: *a2
            X-RateLimit-Limit: *a3
            X-RateLimit-Remaining: *a4
            X-RateLimit-Reset: *a5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
  /api/v1/admin/api-keys:
    post:
      tags:
        - Admin
      summary: Create an API credential
      description: Create an API credential in the selected run. Requires an ADMIN principal.
      operationId: createApiKey
      parameters:
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Create an API credential succeeded.
          headers:
            X-Demo-Run-Id: *a1
            X-Request-Id: *a2
            X-RateLimit-Limit: *a3
            X-RateLimit-Remaining: *a4
            X-RateLimit-Reset: *a5
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateCredentialRequest"
