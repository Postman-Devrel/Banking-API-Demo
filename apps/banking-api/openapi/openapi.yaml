          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesRequest"
  /api/v1/audit-events:
    get:
      tags:
        - Audit
      summary: List append-only audit events
      description: List append-only audit events in the selected run.
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List append-only audit events succeeded.
          headers:
            X-Demo-Run-Id: *a1
            X-Request-Id: *a2
            X-RateLimit-Limit: *a3
            X-RateLimit-Remaining: *a4
            X-RateLimit-Reset: *a5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: A credential resolving to a CUSTOMER or ADMIN principal.
  parameters:
    DemoRunId:
      name: X-Demo-Run-Id
      in: header
      required: false
      description: Isolates state for a comparison lane; defaults to default.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
        default: default
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Caller-provided correlation identifier; generated deterministically when omitted.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for mutations. Exact replays return the original sanitized response; conflicting or
        concurrent duplicates return 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque collection-scoped continuation cursor.
      schema:
        type: string
  headers:
    X-Demo-Run-Id:
      description: Selected demo run.
      schema:
        type: string
    X-Request-Id:
      description: Request correlation identifier.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Request limit for the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix time when the window resets.
      schema:
        type: integer
    Retry-After:
      description: Seconds until another request should be attempted.
      schema:
        type: integer
        minimum: 1
    Idempotency-Replayed:
      description: True when the response was replayed.
      schema:
        type: string
        const: "true"
  schemas:
    Health:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          const: healthy
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          required:
            - name
            - message
          properties:
            name:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
    Page:
      type: object
      additionalProperties: false
      required:
        - limit
        - nextCursor
        - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
    Principal:
      type: object
      additionalProperties: false
      required:
        - principalId
        - role
      properties:
        principalId:
          type: string
          pattern: ^PRN-
        role:
          type: string
          enum:
            - CUSTOMER
            - ADMIN
        customerId:
          type: string
          pattern: ^CUS-
    CredentialCreated:
      type: object
      additionalProperties: false
      required:
        - apiKey
        - principal
      properties:
        apiKey:
          type: string
          writeOnly: true
        principal:
          $ref: "#/components/schemas/Principal"
    Account:
      type: object
      additionalProperties: false
      required:
        - accountId
        - owner
        - accountType
        - createdAt
        - balance
        - currency
        - status
      properties:
        accountId:
          type: string
        owner:
          type: string
        accountType:
          type: string
          enum:
            - STANDARD
            - PREMIUM
            - BUSINESS
        createdAt:
          type: string
          format: date
        balance: &a6
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency: &a7
          type: string
          enum:
            - COSMIC_COINS
            - GALAXY_GOLD
            - MOON_BUCKS
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    Transaction:
      type: object
