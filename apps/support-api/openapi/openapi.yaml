openapi: 3.1.0
info:
  title: Intergalactic Support API
  version: 1.0.0
  description: Deterministic, run-scoped support case management for the Postman Fabric Gateway comparison.
  contact:
    name: Postman Fabric Gateway Demo Maintainers
  license:
    name: ISC
servers:
  - url: http://127.0.0.1:8090
    description: Local deterministic demo service
security:
  - ApiKeyAuth: []
tags:
  - name: System
    description: Service health and contract discovery.
  - name: Cases
    description: Case search, retrieval, and safe case commands.
  - name: Notes
    description: Append-only customer statements and investigation notes.
  - name: Evidence
    description: Immutable, typed evidence snapshots with provenance.
  - name: Verification
    description: Customer-verification request tracking.
  - name: Escalations
    description: Specialist escalation records and routing.
  - name: Lifecycle
    description: Administrator-restricted resolution and closure.
  - name: Assignments
    description: Queue discovery, claiming, transfer, and release.
  - name: Tasks
    description: Investigation task tracking.
  - name: Related Cases
    description: Duplicate discovery and explicit case relationships.
  - name: Interactions
    description: Recorded customer-contact history; these operations do not send messages.
  - name: Knowledge
    description: Searchable seeded support guidance and case links.
  - name: SLA
    description: Deterministic service-level policies and risk.
  - name: Classification
    description: Controlled tags and deterministic classification.
  - name: Guidance
    description: Policy-derived next actions, missing evidence, summaries, and checklists.
  - name: Administration
    description: Credential and local demo controls.
paths:
  /health:
    get:
      tags:
        - System
      operationId: getSupportHealth
      summary: Check Support API health
      description: Check Support API health. The authenticated principal and selected demo run are supplied by the server.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Check Support API health succeeded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-Demo-Run-Id:
              $ref: "#/components/headers/X-Demo-Run-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      x-mcp-safe: false
      security: []
  /openapi.yaml:
    get:
      tags:
        - System
      operationId: getSupportOpenApi
      summary: Download the maintained OpenAPI contract
      description: Download the maintained OpenAPI contract. The authenticated principal and selected demo run are supplied by the server.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Download the maintained OpenAPI contract succeeded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-Demo-Run-Id:
              $ref: "#/components/headers/X-Demo-Run-Id"
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
      x-mcp-safe: false
      security: []
  /v1/cases:
    get:
      tags:
        - Cases
      operationId: listCases
      summary: Search support cases
      description: Search support cases. The authenticated principal and selected demo run are supplied by the server.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: transactionId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - OPEN
              - INVESTIGATING
              - AWAITING_CUSTOMER
              - ESCALATED
              - RESOLVED
              - CLOSED
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum:
              - LOW
              - MEDIUM
              - HIGH
              - CRITICAL
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - UNRECOGNIZED_TRANSACTION
              - PAYMENT_DELAY
              - ACCOUNT_ACCESS
              - CARD_ISSUE
              - OTHER
        - name: assignedQueueId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
      responses:
        "200":
          description: Search support cases succeeded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-Demo-Run-Id:
              $ref: "#/components/headers/X-Demo-Run-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-mcp-safe: true
    post:
      tags:
        - Cases
      operationId: createCase
      summary: Create a support case
      description: Create a support case. The authenticated principal and selected demo run are supplied by the server.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/DemoRunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Create a support case succeeded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-Demo-Run-Id:
              $ref: "#/components/headers/X-Demo-Run-Id"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-mcp-safe: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
            example:
              customerId: CUS-1001
              transactionId: TX-1042
              subject: Unrecognized transfer to Gary Galaxy
              description: The customer does not recognize this transfer.
              category: UNRECOGNIZED_TRANSACTION
              channel: PHONE
              priority: HIGH
              tags:
                - disputed-transfer
