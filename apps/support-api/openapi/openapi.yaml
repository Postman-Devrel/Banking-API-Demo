components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Support agent or administrator credential.
  parameters:
    DemoRunId:
      name: X-Demo-Run-Id
      in: header
      required: false
      description: Isolates Direct and Fabric state.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
        default: default
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation identifier; generated when omitted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for mutations. Exact replay returns the original response.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  headers:
    X-Request-Id:
      description: Request correlation identifier.
      schema:
        type: string
    X-Demo-Run-Id:
      description: Selected demo run.
      schema:
        type: string
    Idempotency-Replayed:
      description: True when the original response was replayed.
