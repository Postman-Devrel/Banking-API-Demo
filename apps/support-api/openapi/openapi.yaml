  responses:
    BadRequest:
      description: The request context, parameters, query, or body are invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A valid Support API key is required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated principal cannot perform this operation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested support resource does not exist in this run.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The command conflicts with lifecycle or idempotency state.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The caller exceeded the configured request limit.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Run or idempotency capacity was reached.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected server error occurred.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Demo-Run-Id:
          $ref: "#/components/headers/X-Demo-Run-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
